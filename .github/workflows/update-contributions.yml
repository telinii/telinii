name: Update Contributions

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:       # Allows manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch contribution count
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(curl -s -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ viewer { contributionsCollection { contributionCalendar { totalContributions } } } }"}' \
            https://api.github.com/graphql \
            | jq -r '.data.viewer.contributionsCollection.contributionCalendar.totalContributions')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Contributions: $COUNT"

      - name: Update README
        run: |
          sed -i "s|/badge/[0-9]*%20Contributions|/badge/${{ steps.fetch.outputs.count }}%20Contributions|g" README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update contributions to ${{ steps.fetch.outputs.count }}"
          git push
